<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Travee — a travel booking system. Demo only; data stays in your browser via localStorage.">
  <title>Travee · Travel Booking</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header shell (hidden on login/guest screens) -->
    <header id="site-header" class="site-header hidden" hidden>
      <div class="header-inner container">
        <a href="#/" class="brand" aria-label="Travee home">
          <span class="brand-mark" aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m2 16 20-5-20-5 4 5-4 5Z"/><path d="M6 11h16"/></svg></span>
          <span class="brand-name">TRAVEE</span>
        </a>
        <nav class="main-nav" aria-label="Primary">
          <a href="#/" data-nav="home" data-view="home">Explore</a>
          <a href="#/wishlist" data-nav="wishlist" data-view="wishlist">Saved</a>
          <a href="#/cart" data-nav="cart" data-view="cart">Cart <span id="cart-badge" class="badge num-tabular hidden">0</span></a>
          <a href="#/dashboard" data-nav="dashboard" data-view="dashboard">Dashboard</a>
          <a href="#/users" data-nav="users" data-view="users">Users</a>
          <a href="#/profile" data-nav="profile" data-view="profile">Profile</a>
        </nav>
        <div class="header-actions">
          <span class="points-pill" title="Loyalty points balance"><span aria-hidden="true"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg></span> <span id="points-balance">0</span> pts</span>
          <button id="logout-btn" class="btn btn-ghost btn-sm hidden" type="button" hidden>Sign out</button>
        </div>
      </div>
    </header>

    <!-- View mount point -->
    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <!-- Footer -->
    <footer id="site-footer" class="site-footer hidden" hidden>
      <div class="container">
        <p>Travee — a semester project demo. All data is stored locally in your browser (localStorage). No real payments, no real accounts, no server.</p>
        <p class="small muted">Photos via Wikimedia Commons (CC BY / CC BY-SA / CC0). <a href="CREDITS.md">Photo credits and licenses</a>.</p>
      </div>
    </footer>
  </div>

  <!-- Toast + modal + skeleton templates -->
  <div id="toast-stack" class="toast-stack" aria-live="assertive"></div>
  <div id="modal-root" class="modal-root hidden" hidden></div>
  <div id="loader-root" class="loader-root hidden"><div class="page-loader"><span class="spinner"></span></div></div>

  <!-- Scripts (order matters: roles -> globals -> utils/state/data -> router -> views -> app) -->
  <script src="js/roles.js"></script>
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/router.js"></script>
  <script src="js/views/login.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/detail.js"></script>
  <script src="js/views/cart.js"></script>
  <script src="js/views/checkout.js"></script>
  <script src="js/views/confirmation.js"></script>
  <script src="js/views/wishlist.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/users.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
